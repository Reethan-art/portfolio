<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="portfolio.css">
</head>
<body>
    <header>
        <div class="header-background">
            <h1>Contact Me</h1>
        </div>
    </header>
    <main>
        <section>
            <h2>Get in Touch</h2>
            <p>If you have any questions or would like to collaborate, feel free to reach out!</p>
            <form action="mailto:your.email@example.com" method="post" enctype="text/plain"></form>
            <div class="form-group">
                <label for="name" id="nameLab" >Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email" id="emailLab">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message" id="messageLab">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" id="send" class="button">Send</button>
            </form>
            <h3 id ="h3"></h3>
            <h3 id ="h23"></h3>
            <h3 id ="h33"></h3>
        </section>
        <div class="button-container">
            <a href="index.html" class="button">Back to Portfolio</a> 
            <a href="fun.html" class="button">The Fun Games</a>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 My Portfolio. All rights reserved.</p>
    </footer> 
    <script src="script.js"></script>
</body>
</html>
